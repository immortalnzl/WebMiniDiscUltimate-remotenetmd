version: '3.8'

services:
  atrac-api:
    image: "${ATRAC_API_IMAGE:-seedstohr/atrac-api:latest}"
    platform: "${ATRAC_API_PLATFORM:-linux/amd64}"
    container_name: webminidisc-atrac-api
    profiles:
      - hq-atrac
    restart: unless-stopped

  frontend:
    build: .
    container_name: webminidisc-frontend
    ports:
      - "8080:80"
      - "8443:443"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: webminidisc-backend
    user: "1000:100"
    environment:
      - MUSIC_DIR=/music
      - DOTENV_PATH=/app/.env
    volumes:
      - music_volume:/music:ro
      - ./.env:/app/.env
      - ./backend/data:/app/backend/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8001:8000"
    restart: unless-stopped

volumes:
  music_volume:
    driver: local
    driver_opts:
      type: "${VOLUME_TYPE:-none}"
      device: "${MUSIC_PATH:-/tmp}"
      o: "${VOLUME_OPTIONS:-bind}"
